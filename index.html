<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PISTE — Planning Lavage · Pt Fixe · Insp. Anti-Corrosion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== PISTE · Premium Glass / Aurora Theme ===== */
:root{
  --bg:#f4f7fc;--bg2:#ffffff;--bg3:#eef2f9;
  --border:#e2e8f1;
  --text:#0a1230;--text2:#576180;--text3:#9aa4bf;
  --pf:#3b82f6;--pf-bg:#dbeafe;--pf-bd:#bfdbfe;--pf-dark:#1d4ed8;
  --lav:#10b981;--lav-bg:#d1fae5;--lav-bd:#a7f3d0;--lav-dark:#047857;
  --tc:#f59e0b;--tc-bg:#fef3c7;--tc-bd:#fde68a;--tc-dark:#b45309;
  --lc:#ec4899;--lc-bg:#fdf2f8;--lc-bd:#fbcfe8;--lc-dark:#be185d;
  --ok:#22c55e;--ok-bg:#dcfce7;--ok-bd:#bbf7d0;--ok-dark:#15803d;
  --dn:#ef4444;--dn-bg:#fee2e2;--dn-bd:#fecaca;
  --skip:#94a3b8;--skip-bg:#f1f5f9;--skip-dark:#475569;
  --warn:#f97316;--warn-bg:#fff7ed;--warn-bd:#fed7aa;
  --glass:rgba(255,255,255,0.62);
  --glass-strong:rgba(255,255,255,0.82);
  --glass-bd:rgba(255,255,255,0.55);
  --glass-bd2:rgba(15,23,42,0.08);
  --blur:22px;
  --sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px -6px rgba(15,23,42,.08);
  --sh2:0 12px 36px -10px rgba(15,23,42,.18),0 2px 8px rgba(15,23,42,.05);
  --grad:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 50%,#06b6d4 100%);
  --grad-soft:linear-gradient(135deg,rgba(59,130,246,.92),rgba(139,92,246,.92))
}
[data-theme="dark"]{
  --bg:#05070d;--bg2:#0c1220;--bg3:#141c2e;
  --border:#1f2a40;
  --text:#eef2fb;--text2:#8895af;--text3:#4d5a76;
  --pf-bg:#172554;--pf-bd:#1e3a5f;
  --lav-bg:#064e3b;--lav-bd:#14532d;
  --tc-bg:#422006;--tc-bd:#713f12;
  --lc-bg:#831843;--lc-bd:#9d174d;
  --ok-bg:#14532d;--ok-bd:#166534;
  --dn-bg:#7f1d1d;--dn-bd:#991b1b;
  --skip-bg:#1e293b;--warn-bg:#7c2d12;--warn-bd:#9a3412;
  --glass:rgba(18,24,40,0.55);
  --glass-strong:rgba(20,28,46,0.78);
  --glass-bd:rgba(255,255,255,0.08);
  --glass-bd2:rgba(255,255,255,0.14);
  --sh:0 1px 2px rgba(0,0,0,.5),0 6px 18px -6px rgba(0,0,0,.45);
  --sh2:0 18px 50px -10px rgba(0,0,0,.65),0 4px 12px rgba(0,0,0,.4)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',sans-serif;font-size:13px;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.005em;
  position:relative;overflow-x:hidden;
  transition:background .4s,color .4s
}
/* Subtle background tint */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(60vw 60vw at 5% 0%,rgba(59,130,246,.10),transparent 60%),
    radial-gradient(50vw 50vw at 95% 100%,rgba(139,92,246,.08),transparent 60%);
  filter:blur(50px)
}
[data-theme="dark"] body::before{
  background:
    radial-gradient(60vw 60vw at 5% 0%,rgba(59,130,246,.06),transparent 60%),
    radial-gradient(50vw 50vw at 95% 100%,rgba(139,92,246,.05),transparent 60%)
}
/* Login */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{
  background:var(--glass-strong);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--glass-bd);
  border-radius:28px;padding:46px 36px;
  max-width:400px;width:100%;text-align:center;
  box-shadow:0 24px 60px -16px rgba(15,23,42,.22),0 6px 18px rgba(15,23,42,.06),inset 0 1px 0 rgba(255,255,255,.6);
  position:relative;overflow:hidden
}
[data-theme="dark"] .login-box{box-shadow:0 24px 60px -16px rgba(0,0,0,.65),0 6px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06)}
.login-box::before{display:none}
.login-box .logo-big{
  width:66px;height:66px;border-radius:20px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
  box-shadow:0 14px 32px -6px rgba(59,130,246,.6),inset 0 1px 0 rgba(255,255,255,.3);
  position:relative
}
.login-box .logo-big svg{width:32px;height:32px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.login-box h1{font-size:20px;font-weight:900;margin-bottom:6px;letter-spacing:-0.02em;position:relative}
.login-box p{font-size:12.5px;color:var(--text2);margin-bottom:22px;position:relative}
.login-box input{
  width:100%;padding:13px 16px;border-radius:14px;
  border:1px solid var(--glass-bd2);
  background:rgba(255,255,255,.62);
  color:var(--text);font-family:inherit;font-size:14px;margin-bottom:12px;
  transition:all .2s;position:relative;
  backdrop-filter:blur(8px)
}
[data-theme="dark"] .login-box input{background:rgba(255,255,255,.04)}
.login-box input:focus{outline:none;border-color:var(--pf);box-shadow:0 0 0 4px rgba(59,130,246,.16);background:rgba(255,255,255,.88)}
[data-theme="dark"] .login-box input:focus{background:rgba(255,255,255,.08)}
.login-box button{
  width:100%;padding:14px;border-radius:14px;border:none;
  background:var(--grad);background-size:200% 200%;
  color:#fff;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
  letter-spacing:0.02em;
  box-shadow:0 10px 26px -6px rgba(59,130,246,.55),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .15s,box-shadow .25s,background-position .4s;
  position:relative
}
.login-box button:hover{transform:translateY(-1px);box-shadow:0 14px 32px -6px rgba(59,130,246,.7);background-position:100% 0%}
.login-box button:active{transform:translateY(0)}
.login-box .error{color:var(--dn);font-size:11.5px;font-weight:700;margin-top:10px;display:none}
/* App */
.app-wrap{display:none}
.hdr{
  padding:14px 26px;display:flex;align-items:center;justify-content:space-between;
  background:var(--glass-strong);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border-bottom:1px solid var(--glass-bd2);
  flex-wrap:wrap;gap:10px;
  position:sticky;top:0;z-index:90;
  box-shadow:0 2px 10px -2px rgba(15,23,42,.06)
}
.logo{
  width:42px;height:42px;border-radius:12px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px -4px rgba(59,130,246,.5),inset 0 1px 0 rgba(255,255,255,.3)
}
.logo svg{width:22px;height:22px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.htitle{font-weight:900;font-size:15.5px;letter-spacing:-0.015em}
.hsub{font-size:10.5px;color:var(--text2);margin-top:1px}
.cdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.cdot.on{background:var(--ok)}
.cdot.off{background:var(--dn);box-shadow:0 0 0 3px rgba(239,68,68,.2)}
/* Buttons */
.btn{
  padding:8px 14px;border-radius:11px;
  border:1px solid var(--glass-bd2);
  background:var(--glass);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--text);cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:700;
  box-shadow:var(--sh);
  transition:all .18s cubic-bezier(.2,.7,.3,1);
  letter-spacing:0.005em
}
.btn:hover{background:var(--glass-strong);transform:translateY(-1px);box-shadow:var(--sh2)}
.btn:active{transform:translateY(0)}
.btn.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 24px -6px rgba(59,130,246,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-sm{padding:6px 12px;font-size:10.5px;border-radius:9px}
.btn-xs{padding:4px 9px;font-size:9.5px;border-radius:7px}
.btn-primary{background:var(--pf);border-color:var(--pf);color:#fff;box-shadow:0 6px 18px -4px rgba(59,130,246,.5)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 6px 18px -4px rgba(34,197,94,.5)}
.btn-dn{border-color:var(--dn-bd);color:var(--dn);background:var(--dn-bg)}
.btn-warn{border-color:var(--warn-bd);color:var(--warn);background:var(--warn-bg)}
.badge{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;font-size:8.5px;padding:2px 7px;border-radius:10px;font-weight:800;margin-left:4px;box-shadow:0 2px 6px rgba(239,68,68,.4)}
.badge-warn{background:linear-gradient(135deg,#f97316,#f59e0b);color:#fff;font-size:8.5px;padding:2px 7px;border-radius:10px;font-weight:800;margin-left:4px;box-shadow:0 2px 6px rgba(249,115,22,.4)}
.theme-btn{
  width:34px;height:34px;border-radius:10px;
  border:1px solid var(--glass-bd2);
  background:var(--glass);
  backdrop-filter:blur(10px);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .25s
}
.theme-btn:hover{background:var(--glass-strong);transform:translateY(-1px) rotate(20deg)}
.theme-btn svg{width:16px;height:16px;stroke:var(--text2);fill:none;stroke-width:2}
.content{padding:28px 32px;position:relative;z-index:1}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:10px;padding:12px 16px;
  position:relative;overflow:hidden;
  transition:box-shadow .2s
}
.stat:hover{box-shadow:var(--sh)}
.stat::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;border-radius:0 3px 3px 0}
.stat:nth-child(1)::before{background:var(--pf)}
.stat:nth-child(2)::before{background:var(--lav)}
.stat:nth-child(3)::before{background:var(--tc)}
.stat:nth-child(4)::before{background:var(--lc)}
.stat:nth-child(5)::before{background:var(--ok)}
.stat:nth-child(6)::before{background:var(--dn)}
.stat-label{font-size:9.5px;color:var(--text2);margin-bottom:2px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.stat-value{font-size:22px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
/* Inputs */
input[type="date"],input[type="text"],input[type="password"],select{
  background:var(--glass);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--glass-bd2);
  color:var(--text);padding:7px 12px;border-radius:10px;
  font-family:inherit;font-size:11.5px;
  box-shadow:var(--sh);transition:all .18s
}
input[type="date"]:focus,input[type="text"]:focus,input[type="password"]:focus,select:focus{outline:none;border-color:var(--pf);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
[data-theme="dark"] input::-webkit-calendar-picker-indicator{filter:invert(.7)}
/* Tables */
table{width:100%;border-collapse:separate;border-spacing:0}
th{padding:10px 12px;text-align:left;font-size:9.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.9px;font-weight:700;border-bottom:1px solid var(--glass-bd2);background:rgba(255,255,255,.35)}
[data-theme="dark"] th{background:rgba(255,255,255,.03)}
td{padding:9px 12px;border-bottom:1px solid var(--glass-bd2);font-size:11.5px}
/* Month nav */
.month-nav{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.month-nav button{
  width:38px;height:38px;border-radius:12px;
  border:1px solid var(--glass-bd2);
  background:var(--glass);
  backdrop-filter:blur(10px);
  cursor:pointer;font-size:14px;font-weight:700;color:var(--text);
  box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;
  transition:all .18s
}
.month-nav button:hover{background:var(--glass-strong);transform:scale(1.06)}
.month-label{font-size:18px;font-weight:900;min-width:170px;text-align:center;text-transform:capitalize;letter-spacing:-0.02em;color:var(--text)}
/* Week block */
.wblock{
  background:var(--glass);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border:1px solid var(--glass-bd2);
  border-radius:16px;margin-bottom:14px;overflow:hidden;
  box-shadow:var(--sh);
  transition:box-shadow .25s
}
.wblock:hover{box-shadow:var(--sh2)}
.wheader{
  padding:10px 18px;
  background:var(--bg3);
  border-bottom:1px solid var(--glass-bd2);
  display:flex;align-items:center;justify-content:space-between
}
[data-theme="dark"] .wheader{background:rgba(255,255,255,.04)}
.wheader-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.wprog{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;color:var(--text2)}
.wprog-bar{width:70px;height:6px;border-radius:4px;background:rgba(15,23,42,.08);overflow:hidden}
[data-theme="dark"] .wprog-bar{background:rgba(255,255,255,.06)}
.wprog-fill{height:100%;border-radius:4px;background:var(--grad);box-shadow:0 0 8px rgba(59,130,246,.35)}
.wgrid{display:grid;grid-template-columns:repeat(5,1fr)}
.dcol{padding:12px 9px;min-height:120px;border-right:1px solid var(--glass-bd2);transition:background .15s}
.dcol:last-child{border-right:none}
.dcol:hover{background:rgba(255,255,255,.18)}
[data-theme="dark"] .dcol:hover{background:rgba(255,255,255,.03)}
.dcol.today{background:linear-gradient(180deg,rgba(59,130,246,.10),transparent 65%)}
.dcol.today .dhead{background:var(--grad);color:#fff;box-shadow:0 4px 14px -2px rgba(59,130,246,.5)}
.dcol.outside{opacity:.2;pointer-events:none}
.dhead{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:9px;margin-bottom:8px;background:rgba(15,23,42,.04);letter-spacing:.5px}
[data-theme="dark"] .dhead{background:rgba(255,255,255,.04)}
.tsec{margin-bottom:6px}
.tsec-head{font-size:7.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:2px 6px;border-radius:5px;margin-bottom:3px;display:inline-block}
.tsec-head.pf-h{background:var(--pf-bg);color:var(--pf-dark)}
.tsec-head.lav-h{background:var(--lav-bg);color:var(--lav-dark)}
.tsec-head.tc-h{background:var(--tc-bg);color:var(--tc-dark)}
.tsec-head.lc-h{background:var(--lc-bg);color:var(--lc-dark)}
.tp{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px;font-size:9.5px;font-weight:700;margin-bottom:3px;border-left:3px solid transparent;transition:transform .15s,background .15s}
.tp:hover{transform:translateX(1px)}
.tp.pending{background:rgba(15,23,42,.04)}
[data-theme="dark"] .tp.pending{background:rgba(255,255,255,.03)}
.tp.pending-pf{border-left-color:var(--pf)}
.tp.pending-lav{border-left-color:var(--lav)}
.tp.pending-tc{border-left-color:var(--tc)}
.tp.pending-lc{border-left-color:var(--lc)}
.tp.done{background:var(--ok-bg);color:var(--ok-dark);border-left-color:var(--ok)}.tp.done .tp-ico{background:var(--ok);color:#fff}
.tp.missed{background:var(--dn-bg);color:var(--dn);border-left-color:var(--dn)}.tp.missed .tp-ico{background:var(--dn);color:#fff}
.tp.skip{background:var(--skip-bg);color:var(--skip-dark);border-left-color:var(--skip);opacity:.55;font-style:italic}.tp.skip .tp-ico{background:var(--skip);color:#fff}
.tp-ico{width:15px;height:15px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8.5px;flex-shrink:0;font-style:normal;font-weight:800}
.tp-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-badge{font-size:6.5px;font-weight:800;padding:1.5px 4.5px;border-radius:4px;white-space:nowrap}
/* Legend */
.legend-bar{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;
  background:var(--glass);
  backdrop-filter:blur(var(--blur));
  border-radius:12px;border:1px solid var(--glass-bd2);
  font-size:10.5px;box-shadow:var(--sh)
}
.legend-item{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--text2)}
.ld{width:10px;height:10px;border-radius:4px;border:2px solid}
.ld-p{background:var(--bg3);border-color:var(--text3)}
.ld-d{background:var(--ok-bg);border-color:var(--ok)}
.ld-m{background:var(--dn-bg);border-color:var(--dn)}
.ld-s{background:var(--skip-bg);border-color:var(--skip)}
/* Toggle */
.toggle{width:38px;height:20px;border-radius:10px;cursor:pointer;position:relative;border:none;transition:background .25s}
.toggle.on{background:linear-gradient(135deg,#22c55e,#10b981);box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.toggle.off{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;transition:all .25s cubic-bezier(.4,1.5,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on::after{left:21px}
.toggle.off::after{left:3px}
/* Notif */
#notif{
  display:none;position:fixed;top:18px;right:18px;
  padding:12px 22px;border-radius:14px;
  font-size:12.5px;font-weight:700;z-index:200;
  background:var(--glass-strong);
  backdrop-filter:blur(var(--blur));
  border:1px solid var(--glass-bd2);
  box-shadow:var(--sh2);
  animation:notifIn .35s cubic-bezier(.2,1,.4,1)
}
@keyframes notifIn{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Pending card */
.pend-card{
  background:var(--glass);
  backdrop-filter:blur(var(--blur));
  border:1px solid var(--warn-bd);
  border-left:4px solid var(--warn);
  border-radius:14px;
  padding:14px 18px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
  box-shadow:var(--sh)
}
.bulk-area{
  background:var(--glass);
  backdrop-filter:blur(var(--blur));
  border:1px solid var(--glass-bd2);
  border-radius:16px;padding:20px;margin-bottom:18px;
  box-shadow:var(--sh)
}
.bulk-area h3{font-size:14px;font-weight:800;margin-bottom:12px;letter-spacing:-0.01em}
.bulk-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.bulk-row .field{flex:1;min-width:110px}
.bulk-row .field label{font-size:10.5px;color:var(--text2);display:block;margin-bottom:3px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.bulk-row .field select,.bulk-row .field input{width:100%;padding:8px 12px}
.ocard{
  background:var(--glass);
  backdrop-filter:blur(var(--blur));
  border:1px solid var(--dn-bd);
  border-left:4px solid var(--dn);
  border-radius:14px;margin-bottom:12px;overflow:hidden;
  box-shadow:var(--sh)
}
.ohead{padding:12px 16px;background:linear-gradient(90deg,var(--dn-bg),transparent);border-bottom:1px solid rgba(0,0,0,.05)}
[data-theme="dark"] .ohead{background:linear-gradient(90deg,rgba(127,29,29,.5),transparent)}
.sig-area{
  margin-top:16px;padding:18px;
  background:var(--glass);
  backdrop-filter:blur(var(--blur));
  border-radius:12px;
  border:1px solid var(--glass-bd2)
}
.mrow{
  background:var(--glass);
  backdrop-filter:blur(var(--blur));
  border:1px solid var(--glass-bd2);
  border-radius:12px;padding:16px;margin-bottom:12px;
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
  box-shadow:var(--sh);
  transition:transform .15s,box-shadow .25s
}
.mrow:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.field label{font-size:10.5px;color:var(--text2);display:block;margin-bottom:3px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
/* Audit log */
.log-entry{padding:10px 14px;border-bottom:1px solid var(--glass-bd2);font-size:11.5px;display:flex;gap:12px;align-items:center;transition:background .15s}
.log-entry:hover{background:rgba(255,255,255,.2)}
[data-theme="dark"] .log-entry:hover{background:rgba(255,255,255,.03)}
.log-entry:last-child{border-bottom:none}
.log-who{font-weight:800;color:var(--pf);min-width:90px}
.log-when{color:var(--text3);font-size:10.5px;min-width:130px;font-variant-numeric:tabular-nums}
.log-what{flex:1;color:var(--text)}
/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(15,23,42,.15);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(15,23,42,.28);background-clip:padding-box}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);background-clip:padding-box}
[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28);background-clip:padding-box}
/* Print */
.print-header,.print-footer{display:none}
@media print{
  body::before{display:none!important}
  @page{size:landscape;margin:10mm}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  body{background:#fff!important;font-size:11px!important;color:#000!important}
  .hdr,.stats,.no-print,#notif,.month-nav,.legend-bar,.login-screen{display:none!important}
  .app-wrap{display:block!important}
  .print-header{display:block!important;text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:3px solid #0f172a}
  .print-header h1{font-size:18px;font-weight:900;text-transform:uppercase;margin-bottom:4px;letter-spacing:.5px}
  .print-header p{font-size:11px;color:#333;margin-top:2px}
  .content{padding:0!important}
  .wblock{border:1.5px solid #999!important;margin-bottom:10px!important;break-inside:avoid;background:#fff!important;border-radius:6px!important}
  .wheader{padding:8px 14px!important;background:#f1f5f9!important;border-bottom:1.5px solid #999!important}
  .wheader-label{font-size:12px!important;color:#000!important;font-weight:900!important}
  .wprog{font-size:11px!important;font-weight:800!important}
  .wprog-bar{width:60px!important;height:6px!important}
  .wprog-fill{background:#1d4ed8!important;box-shadow:none!important}
  .dcol{padding:8px 6px!important;min-height:70px!important;border-color:#ccc!important;background:#fff!important}
  .dcol.today{background:#eff6ff!important;border-top:3px solid #2563eb!important}
  .dcol.outside{opacity:.15!important}
  .dhead{font-size:12px!important;padding:5px 8px!important;margin-bottom:6px!important;font-weight:900!important;background:#f0f2f5!important;border-radius:5px!important;color:#000!important}
  .dcol.today .dhead{background:#2563eb!important;color:#fff!important}
  .tsec{margin-bottom:5px!important}
  .tsec-head{font-size:9px!important;padding:2px 6px!important;font-weight:900!important;border-radius:4px!important}
  .tp{font-size:10px!important;padding:3px 6px!important;margin-bottom:2px!important;border-left-width:3px!important;border-radius:4px!important}
  .tp-ico{width:14px!important;height:14px!important;font-size:9px!important;border-radius:3px!important}
  .tp-name{font-size:10px!important}
  .tp-badge{font-size:7px!important;padding:1px 5px!important}
  .tp.done{background:transparent!important;color:#000!important;border-left-color:#000!important}
  .tp.missed{background:transparent!important;color:#000!important;border-left-color:#000!important;animation:none!important}
  .tp.skip{background:transparent!important;color:#888!important;opacity:.5!important}
  .tp.pending{background:transparent!important;color:#000!important}
  .tp-ico{background:transparent!important;color:#000!important}
  .tp.done .tp-ico{background:transparent!important}
  .tp.missed .tp-ico{background:transparent!important}
  .tp-badge{background:transparent!important;color:#000!important;border:1px solid #999!important}
  .tp.done .tp-badge{background:transparent!important;color:#000!important}
  .tp.missed .tp-badge{background:transparent!important;color:#000!important}
  .tsec-head{background:#ddd!important;color:#000!important;border:1px solid #aaa!important}
  .print-footer{display:block!important;margin-top:16px;page-break-inside:avoid}
}
/* ===== Sidebar + Topbar (Maya v2) ===== */
:root{--sidebar-w:208px}
.app-shell{grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;transition:grid-template-columns .22s cubic-bezier(.2,.7,.3,1)}
#sidebar{
  position:fixed;left:0;top:0;height:100vh;width:var(--sidebar-w);z-index:50;
  display:flex;flex-direction:column;
  background:var(--glass-strong);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-right:1px solid var(--glass-bd2);
  transition:width .22s cubic-bezier(.2,.7,.3,1);
  overflow:hidden
}
.sb-head{
  height:72px;display:flex;align-items:center;gap:12px;padding:0 16px;
  border-bottom:1px solid var(--glass-bd2);flex-shrink:0
}
.sb-logo{
  width:38px;height:38px;border-radius:11px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 8px 22px -4px rgba(59,130,246,.5),inset 0 1px 0 rgba(255,255,255,.3)
}
.sb-logo svg{width:20px;height:20px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.sb-wm{display:flex;flex-direction:column;line-height:1;overflow:hidden;white-space:nowrap}
.sb-wm-title{font-size:16px;font-weight:700;letter-spacing:-0.01em}
.sb-wm-sub{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text2);margin-top:4px}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0;display:flex;flex-direction:column}
.sb-sec{padding:18px 16px 6px}
.sb-sec-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text2);opacity:.55;padding:0 6px;line-height:1}
.sb-items{display:flex;flex-direction:column;gap:2px;padding:6px 8px}
.sb-it{
  position:relative;display:flex;align-items:center;gap:12px;
  min-height:46px;padding:0 14px;border-radius:10px;
  font-size:13.5px;font-weight:600;color:var(--text2);
  background:transparent;border:none;cursor:pointer;
  font-family:inherit;text-align:left;width:100%;
  transition:background .15s,color .15s
}
.sb-it svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.75;transition:opacity .15s}
.sb-it-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-it:hover{background:rgba(15,23,42,0.05);color:var(--text)}
[data-theme="dark"] .sb-it:hover{background:rgba(255,255,255,0.05)}
.sb-it:hover svg{opacity:1}
.sb-it.active{
  background:var(--pf-bg);
  color:var(--pf-dark);font-weight:700
}
.sb-it.active svg{opacity:1}
.sb-it.active::before{
  content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;
  background:var(--pf)
}
.sb-it:focus-visible{outline:2px solid var(--pf);outline-offset:2px}
.sb-badge{
  min-width:22px;height:20px;border-radius:10px;padding:0 7px;
  background:var(--dn);color:#fff;
  font-size:10.5px;font-weight:700;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-left:auto;
  letter-spacing:.01em;font-variant-numeric:tabular-nums
}
.sb-badge.warn{background:var(--warn)}
.sb-foot{
  border-top:1px solid var(--glass-bd2);
  padding:10px;display:flex;flex-direction:column;gap:6px;flex-shrink:0
}
.sb-user{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  background:rgba(255,255,255,0.04);border:1px solid var(--glass-bd2)
}
[data-theme="dark"] .sb-user{background:rgba(255,255,255,0.03)}
.sb-avatar{
  width:32px;height:32px;border-radius:50%;
  background:var(--grad);
  color:#fff;font-weight:800;font-size:12px;letter-spacing:0.02em;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 4px 12px -2px rgba(59,130,246,.45),inset 0 1px 0 rgba(255,255,255,.2)
}
.sb-user-info{flex:1;overflow:hidden;display:flex;flex-direction:column;line-height:1.2}
.sb-user-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user-role{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em}
.sb-icon-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--glass-bd2);
  background:var(--glass);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);transition:all .15s;flex-shrink:0
}
.sb-icon-btn:hover{background:var(--glass-strong);color:var(--text);transform:translateY(-1px)}
.sb-icon-btn:focus-visible{outline:2px solid #6366f1;outline-offset:2px}
.sb-icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb-icon-btn.danger:hover{color:var(--dn);border-color:var(--dn-bd);background:var(--dn-bg)}
.sb-foot-row{display:flex;align-items:center;gap:6px}
.sb-toggle{
  width:100%;height:32px;border-radius:9px;border:1px solid var(--glass-bd2);
  background:var(--glass);cursor:pointer;color:var(--text2);
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;font-size:11px;font-weight:700;
  transition:all .15s
}
.sb-toggle:hover{background:var(--glass-strong);color:var(--text)}
.sb-toggle:focus-visible{outline:2px solid #6366f1;outline-offset:2px}
.sb-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s}
/* Collapsed state */
#sidebar.collapsed{width:56px}
#sidebar.collapsed .sb-wm,
#sidebar.collapsed .sb-sec-h,
#sidebar.collapsed .sb-user-info,
#sidebar.collapsed .sb-toggle-lbl,
#sidebar.collapsed .sb-it-lbl{display:none}
#sidebar.collapsed .sb-head{justify-content:center;padding:0}
#sidebar.collapsed .sb-sec{padding:10px 4px 4px}
#sidebar.collapsed .sb-sec:first-of-type{padding-top:6px}
#sidebar.collapsed .sb-items{padding:2px 6px}
#sidebar.collapsed .sb-it{
  height:42px;padding:0;gap:0;
  justify-content:center;align-items:center;position:relative
}
#sidebar.collapsed .sb-it svg{width:22px;height:22px}
#sidebar.collapsed .sb-it.active::before{top:6px;bottom:6px}
/* Collapsed: notification dot only (no number, no overlap with icon) */
#sidebar.collapsed .sb-badge{
  position:absolute;top:8px;right:10px;
  min-width:8px;width:8px;height:8px;
  font-size:0;color:transparent;padding:0;border-radius:50%;
  margin-left:0
}
#sidebar.collapsed .sb-foot{padding:8px 6px}
#sidebar.collapsed .sb-user{padding:4px;justify-content:center;background:transparent;border:none}
#sidebar.collapsed .sb-foot-row{flex-direction:column;gap:4px}
#sidebar.collapsed .sb-toggle svg{transform:rotate(180deg)}
/* Main area + topbar */
#mainArea{grid-column:2;display:flex;flex-direction:column;min-width:0;height:100vh;overflow-y:auto;overflow-x:hidden}
#topbar{
  position:sticky;top:0;z-index:40;
  height:60px;display:flex;align-items:center;gap:16px;
  padding:0 30px;
  background:var(--glass-strong);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--glass-bd2);
  box-shadow:0 1px 3px rgba(15,23,42,.04)
}
.tb-left{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.tb-title{font-size:20px;font-weight:800;letter-spacing:-0.02em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-sub{font-size:12px;font-weight:500;color:var(--text2);opacity:.7;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-spacer{flex:1}
.tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#cs.fb-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-bd2);
  font-size:11px;font-weight:700;color:var(--text2)
}
#cs.fb-pill .cdot{width:8px;height:8px;margin-right:0}
/* Sidebar responsive: hamburger menu on < 1100px (tablet + mobile) */
/* Settings sub-nav */
.settings-layout{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:flex-start}
.settings-nav{
  position:sticky;top:80px;
  background:var(--glass);
  backdrop-filter:blur(var(--blur));
  border:1px solid var(--glass-bd2);
  border-radius:14px;padding:8px;
  display:flex;flex-direction:column;gap:2px;
  box-shadow:var(--sh)
}
.settings-nav-item{
  position:relative;display:flex;align-items:center;gap:10px;
  height:40px;padding:0 12px;border-radius:8px;
  font-size:12.5px;font-weight:600;color:var(--text2);
  background:transparent;border:none;cursor:pointer;
  font-family:inherit;text-align:left;width:100%;
  transition:all .15s
}
.settings-nav-item svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.settings-nav-item:hover{background:rgba(15,23,42,.04);color:var(--text)}
[data-theme="dark"] .settings-nav-item:hover{background:rgba(255,255,255,.05)}
/* Tab system: only show active section */
.settings-section{display:none;animation:tabIn .22s ease-out}
.settings-section.active{display:block}
@keyframes tabIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.settings-nav-item.active{background:var(--pf-bg);color:var(--pf-dark);font-weight:700}
.settings-nav-item.active::before{
  content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;
  background:var(--pf)
}
.settings-nav-item:focus-visible{outline:2px solid var(--pf);outline-offset:2px}
.settings-panel{min-width:0}
@media (max-width:900px){
  .settings-layout{grid-template-columns:1fr;gap:12px}
  .settings-nav{
    position:static;flex-direction:row;flex-wrap:nowrap;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    gap:6px;padding:6px;
    scrollbar-width:thin
  }
  .settings-nav-item{
    flex-shrink:0;height:38px;padding:0 14px;white-space:nowrap;
    font-size:12px
  }
  .settings-nav-item.active::before{display:none}
  .settings-nav-item.active{background:var(--pf);color:#fff}
}
/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  #sidebar,.app-shell,.sb-it,.sb-icon-btn,.sb-toggle svg{transition:none!important}
}
/* Reduced transparency */
@media (prefers-reduced-transparency: reduce){
  :root{--glass-strong:var(--bg2);--glass:var(--bg2)}
  #sidebar,#topbar{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
}
/* Hide legacy header */
.hdr{display:none!important}
/* ===== Clean Enhancements ===== */
/* View transition */
#vSch,#vFlt,#vRet,#vVal,#vAdm,#vLog{animation:viewIn .25s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* Table styling */
tbody tr{transition:background .12s}
tbody tr:nth-child(even){background:rgba(15,23,42,.02)}
[data-theme="dark"] tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
tbody tr:hover{background:rgba(59,130,246,.04)!important}
[data-theme="dark"] tbody tr:hover{background:rgba(59,130,246,.06)!important}
/* Topbar title */
.tb-title{font-size:20px;font-weight:800;color:var(--text)}
/* Sidebar title */
.sb-wm-title{font-size:16px;font-weight:800;color:var(--text)}
/* Active sidebar item */
.sb-it.active{background:var(--pf-bg);color:var(--pf-dark)}
[data-theme="dark"] .sb-it.active{background:var(--pf-bg);color:#93c5fd}
/* Hamburger button (mobile) */
.tb-hamburger{
  display:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg2);cursor:pointer;align-items:center;justify-content:center;flex-shrink:0
}
.tb-hamburger svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round}
/* Sidebar backdrop (mobile) */
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99;opacity:0;transition:opacity .2s}
.sb-backdrop.show{opacity:1}
/* ===== Responsive ===== */
/* Tablet + Mobile: hamburger menu mode (< 1100px) */
@media (max-width:1100px){
  .app-shell{grid-template-columns:1fr!important}
  #sidebar{
    transform:translateX(-100%);z-index:100;
    width:280px!important;
    box-shadow:4px 0 24px rgba(0,0,0,.18);
    transition:transform .25s cubic-bezier(.2,.7,.3,1)!important
  }
  #sidebar.mobile-open{transform:translateX(0)}
  /* Force expanded look when sidebar slides out (override .collapsed) */
  #sidebar.collapsed{width:280px!important}
  #sidebar.collapsed .sb-wm,
  #sidebar.collapsed .sb-sec-h,
  #sidebar.collapsed .sb-user-info,
  #sidebar.collapsed .sb-toggle-lbl,
  #sidebar.collapsed .sb-it-lbl{display:flex}
  #sidebar.collapsed .sb-it{
    flex-direction:row;height:46px;padding:0 14px;gap:12px;
    font-size:14px;align-items:center;justify-content:flex-start
  }
  #sidebar.collapsed .sb-it svg{width:20px;height:20px}
  #sidebar.collapsed .sb-it-lbl{font-size:14px;text-align:left;margin-top:0;display:block}
  #sidebar.collapsed .sb-badge{
    position:static;min-width:22px;height:20px;
    font-size:11px;padding:0 7px;border-radius:10px
  }
  #sidebar.collapsed .sb-it.active::before{top:8px;bottom:8px}
  #sidebar.collapsed .sb-head{justify-content:flex-start;padding:0 16px}
  #sidebar.collapsed .sb-sec{padding:14px 16px 4px}
  #sidebar.collapsed .sb-items{padding:4px 8px}
  #sidebar.collapsed .sb-foot{padding:10px}
  #sidebar.collapsed .sb-user{padding:8px 10px;justify-content:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--glass-bd2)}
  #sidebar.collapsed .sb-foot-row{flex-direction:row}
  #sidebar.collapsed .sb-toggle svg{transform:none}
  .sb-backdrop.show{display:block}
  .tb-hamburger{display:flex}
  #mainArea{grid-column:1}
  .sb-toggle{display:none}
  .stats{grid-template-columns:repeat(3,1fr)}
}
/* Mobile refinements (< 768px) */
@media (max-width:768px){
  #topbar{padding:0 14px;height:52px;gap:10px}
  .tb-title{font-size:17px}
  .tb-actions .btn,.tb-actions select{display:none}
  #cs.fb-pill{font-size:0;padding:4px 8px}
  #cs.fb-pill .cdot{margin-right:0}
  .content{padding:16px}
  .stats{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{padding:10px 12px}
  .stat-value{font-size:18px}
  .stat-label{font-size:8.5px;letter-spacing:.6px}
  .month-nav{flex-wrap:wrap;gap:8px}
  .month-nav button{width:34px;height:34px}
  .month-label{font-size:16px;min-width:auto}
  .legend-bar{font-size:9.5px;padding:8px 12px;gap:6px;flex-wrap:wrap}
  .wblock{border-radius:10px}
  .wgrid{grid-template-columns:1fr!important;gap:0}
  .dcol{min-height:auto;padding:10px 12px;border-right:none;border-bottom:1px solid var(--glass-bd2)}
  .dcol:last-child{border-bottom:none}
  .dhead{font-size:11px;padding:4px 8px;border-radius:6px;margin-bottom:6px}
  .wheader{padding:8px 14px}
  .wheader-label{font-size:10px}
  .wprog{font-size:9.5px}
  .wprog-bar{width:50px}
  .mrow{flex-direction:column;gap:8px}
  .bulk-row{flex-direction:column;gap:8px}
  .settings-layout{grid-template-columns:1fr!important}
  .settings-nav{position:static!important;flex-direction:row;flex-wrap:nowrap;overflow-x:auto}
  table{font-size:11px}
  th,td{padding:7px 8px}
  .pend-card{flex-direction:column;align-items:flex-start;gap:8px}
  .login-box{padding:32px 24px;border-radius:20px;max-width:340px}
  .login-box .logo-big{width:56px;height:56px;border-radius:16px;margin-bottom:18px}
  .login-box h1{font-size:18px}
  .login-box input{padding:12px 14px;font-size:13px;margin-bottom:10px;border-radius:12px}
  .login-box button{padding:13px;font-size:14px;border-radius:12px}
}
/* Small mobile */
@media (max-width:400px){
  .stats{grid-template-columns:1fr 1fr;gap:6px}
  .stat{padding:8px 10px}
  .stat-value{font-size:16px}
  .content{padding:12px}
  #topbar{padding:0 12px;gap:8px}
  .tb-actions{gap:4px}
  .tb-actions .btn{padding:5px 8px;font-size:10px}
}
/* Print */
@media print{

<script>
const WD=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"],MO=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const isWE=d=>{const x=new Date(d+'T12:00:00');return x.getDay()===0||x.getDay()===6;};
const fmt=d=>{if(!d)return"";return new Date(d+'T12:00:00').toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});};
const fmtL=d=>{if(!d)return"";return new Date(d+'T12:00:00').toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});};
const daysBetween=(a,b)=>{if(!a||!b)return 999;return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);};
const today=iso(new Date());const fbK=im=>im.replace(/[.#$/\[\]]/g,"_");
const dim=(m,y)=>new Date(y,m+1,0).getDate();const mKey=(m,y)=>y+'-'+String(m+1).padStart(2,'0');
const MIN_INT={pointFixe:7,lavage:9,corrosion:9,lavComp:7};
const TLABEL={pointFixe:"Pt Fixe",lavage:"Lavage",corrosion:"Insp. Anti-Corr.",lavComp:"Lav. Compr."};
const FLABEL={lastFlight:"Dernier Vol",lastLavage:"Dernier Lavage",lastPointFixe:"Dernier Pt Fixe",lastCorrosion:"Dernier Insp. Anti-Corrosion",lastLavComp:"Dernier Lav. Compresseur"};
const TASK_TYPES=["pointFixe","lavage","corrosion","lavComp"];

let fleet=[],pubSched=null,pendingSubs={},admins={admin:{name:"Administrateur",password:"admin",role:"super"}},auditLogs=[],mobileUsers={},curAdmin=null,isSuper=false,cv="schedule",db=null,isDark=false;
let sigName="",sigPost="",sigImage="";
let pFonts={title:18,subtitle:11,weekHeader:12,dayHeader:12,sectionLabel:9,taskName:10,taskBadge:7,signature:11};
let maxDay={pointFixe:1,lavage:1,corrosion:1,lavComp:1};
let cM=new Date().getMonth(),cY=new Date().getFullYear();

function tTh(){isDark=!isDark;document.documentElement.setAttribute("data-theme",isDark?"dark":"");localStorage.setItem("piste_theme",isDark?"dark":"light");document.getElementById("tIco").innerHTML=isDark?'<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>':'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';}
if(localStorage.getItem("piste_theme")==="dark")tTh();

// ===== AUTH =====
function doLogin(){
  const u=document.getElementById("loginUser").value.trim().toLowerCase();
  const p=document.getElementById("loginPwd").value;
  const admin=admins[u];
  if(admin&&admin.password===p){
    curAdmin=admin;curAdmin.id=u;isSuper=(u==="admin"||admin.role==="super");
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("appWrap").style.display="grid";
    document.getElementById("adminName").textContent=(admin.name||u)+(isSuper?" (Admin)":"  (Lecture)");
    document.getElementById("superBtns").style.display=isSuper?"block":"none";document.getElementById("sysBtns").style.display=isSuper?"block":"none";updateUserCard();
    sessionStorage.setItem("piste_admin",u);
    addLog("Connexion");render();
  } else document.getElementById("loginError").style.display="block";
}
function doLogout(){curAdmin=null;sessionStorage.removeItem("piste_admin");document.getElementById("appWrap").style.display="none";document.getElementById("loginScreen").style.display="flex";document.getElementById("loginPwd").value="";document.getElementById("loginUser").value="";}
function addLog(action){if(!db||!curAdmin)return;db.ref("auditLog").push({who:curAdmin.name||curAdmin.id,action,at:new Date().toISOString()});}

// ===== FIREBASE =====
function initFB(){try{
  firebase.initializeApp(FC);db=firebase.database();
  db.ref(".info/connected").on("value",s=>{document.getElementById("cs").innerHTML=(s.val()?'<span class="cdot on"></span>Connecté':'<span class="cdot off"></span>Hors ligne');});
  // Load admins first for login
  db.ref("admins").on("value",s=>{
    admins=s.val()||{};
    if(!admins.admin){db.ref("admins/admin").set({name:"Administrateur",password:"admin",role:"super"});admins.admin={name:"Administrateur",password:"admin",role:"super"};}
    // Force super role on admin account
    if(admins.admin){admins.admin.role="super";db.ref("admins/admin/role").set("super");}
    // Auto-login from session
    const saved=sessionStorage.getItem("piste_admin");
    if(saved&&admins[saved]){curAdmin=admins[saved];curAdmin.id=saved;isSuper=(saved==="admin"||curAdmin.role==="super");document.getElementById("loginScreen").style.display="none";document.getElementById("appWrap").style.display="grid";document.getElementById("adminName").textContent=(curAdmin.name||saved)+(isSuper?" (Admin)":" (Lecture)");document.getElementById("superBtns").style.display=isSuper?"block":"none";document.getElementById("sysBtns").style.display=isSuper?"block":"none";updateUserCard();render();}
  });
  db.ref("mobileUsers").on("value",s=>{mobileUsers=s.val()||{};if(cv==="admin")rAdm();});
  db.ref("fleet").on("value",s=>{const d=s.val();if(d)fleet=Object.values(d);else fleet=[];loadOrGen();});
  db.ref("pendingSubmissions").on("value",s=>{pendingSubs=s.val()||{};render();});
  db.ref("auditLog").limitToLast(100).on("value",s=>{const d=s.val();auditLogs=d?Object.values(d).reverse():[];if(cv==="logs")rLog();});
  db.ref("config").on("value",s=>{const c=s.val()||{};sigName=c.sigName||"";sigPost=c.sigPost||"";sigImage=c.sigImage||"";if(c.pFonts)pFonts={...pFonts,...c.pFonts};if(c.maxDay)maxDay={...maxDay,...c.maxDay};applyPrintFonts();});
}catch(e){console.error(e);}}

// ===== TASK STATUS =====
function taskStatus(im,ty,schedDate){
  const ac=fleet.find(a=>a.immat===im);if(!ac)return{st:"pending"};
  const lk=ty==="pointFixe"?"lastPointFixe":ty==="lavage"?"lastLavage":ty==="corrosion"?"lastCorrosion":"lastLavComp";
  const ld=ac[lk];const mi=MIN_INT[ty];
  if(ld&&ld>=schedDate){return{st:"done",doneDate:ld>schedDate?ld:null};}
  if(ty==="pointFixe"){const lf=ac.lastFlight,lp=ac.lastPointFixe;const base=(!lf&&!lp)?null:(!lp)?lf:(!lf)?lp:(lf>lp?lf:lp);if(base){const g=daysBetween(base,schedDate);if(g<mi)return{st:"skip",label:`Dern.${base===lf?" vol":" PF"} -${mi-g}j`};}}
  else{if(ld){const g=daysBetween(ld,schedDate);if(g<mi)return{st:"skip",label:`Dern.${TLABEL[ty]} -${mi-g}j`};}}
  if(schedDate<today)return{st:"missed"};
  return{st:"pending"};
}

// ===== SCHEDULE =====
function generateSchedule(){
  const nd=dim(cM,cY),sd=new Date(cY,cM,1),sc={};
  for(let i=0;i<nd;i++){sc[dk(addD(sd,i))]={pointFixe:[],lavage:[],corrosion:[],lavComp:[]};}
  const af=fleet.filter(a=>a.active),needs=[];
  af.forEach(ac=>{if(!ac.lastFlight)return;const lf=new Date(ac.lastFlight);
    const pfR=ac.lastPointFixe?new Date(ac.lastPointFixe):null,pfB=pfR&&pfR>lf?pfR:lf;
    needs.push({im:ac.immat,ty:"pointFixe",due:addD(pfB,7),pr:addD(pfB,7).getTime()});
    const lR=ac.lastLavage?new Date(ac.lastLavage):lf;needs.push({im:ac.immat,ty:"lavage",due:addD(lR,9),pr:addD(lR,9).getTime()});
    const cR=ac.lastCorrosion?new Date(ac.lastCorrosion):lf;needs.push({im:ac.immat,ty:"corrosion",due:addD(cR,9),pr:addD(cR,9).getTime()});
    if(ac.hasLavComp){const lcR=ac.lastLavComp?new Date(ac.lastLavComp):lf;needs.push({im:ac.immat,ty:"lavComp",due:addD(lcR,7),pr:addD(lcR,7).getTime()});}
  });
  needs.sort((a,b)=>a.pr-b.pr);const used=new Set();
  for(let i=0;i<needs.length;i++){const n=needs[i],k=`${n.im}-${n.ty}-${n.due.getTime()}`;if(used.has(k))continue;
    for(let j=0;j<nd;j++){const d=addD(sd,j),d2=dk(d);if(d2<today||isWE(d2)||d<n.due)continue;const s=sc[d2];if(!s)continue;
      if(n.ty==="pointFixe"&&s.pointFixe.length>=maxDay.pointFixe)continue;if(n.ty==="lavage"&&s.lavage.length>=maxDay.lavage)continue;if(n.ty==="corrosion"&&s.corrosion.length>=maxDay.corrosion)continue;if(n.ty==="lavComp"&&s.lavComp.length>=maxDay.lavComp)continue;
      if(n.ty==="pointFixe"&&(s.lavage.includes(n.im)||s.corrosion.includes(n.im)||s.lavComp.includes(n.im)))continue;
      if((n.ty==="lavage"||n.ty==="corrosion"||n.ty==="lavComp")&&s.pointFixe.includes(n.im))continue;
      if(s[n.ty].includes(n.im))continue;
      s[n.ty].push(n.im);used.add(k);const me=dk(new Date(cY,cM,nd));
      const interval=n.ty==="lavComp"||n.ty==="pointFixe"?7:9;
      const nx=addD(d,interval);if(dk(nx)<=me){needs.push({im:n.im,ty:n.ty,due:nx,pr:nx.getTime()});needs.sort((a,b)=>a.pr-b.pr);}break;
    }
  }
  sc._genDate=today;return sc;
}
function publishSchedule(){pubSched=generateSchedule();if(db){db.ref("schedules/"+mKey(cM,cY)).set(pubSched);if(pubSched[today])db.ref("todaySchedule").set(pubSched[today]);}addLog("Planning regénéré ("+MO[cM]+" "+cY+")");render();}
function loadOrGen(){if(!db){pubSched=generateSchedule();render();return;}db.ref("schedules/"+mKey(cM,cY)).once("value",s=>{const d=s.val();if(d){pubSched=d;render();}else publishSchedule();});}

// ===== VALIDATION =====
function approveSub(id){const p=pendingSubs[id];if(!p||!db)return;db.ref("fleet/"+fbK(p.immat)+"/"+p.field).set(p.value);db.ref("pendingSubmissions/"+id).remove();const who=curAdmin?(curAdmin.name||curAdmin.id):"admin";addLog(`Validé par ${who}: ${p.immat} ${p.label}=${fmt(p.value)} (soumis par ${p.submittedBy||'—'})`);}
function rejectSub(id){const p=pendingSubs[id];if(!db)return;db.ref("pendingSubmissions/"+id).remove();const who=curAdmin?(curAdmin.name||curAdmin.id):"admin";if(p)addLog(`Rejeté par ${who}: ${p.immat} ${p.label} (soumis par ${p.submittedBy||'—'})`);}
function approveAll(){Object.keys(pendingSubs).forEach(id=>approveSub(id));}

// ===== STATS =====
const tl=t=>t==="pointFixe"?"PT FIXE":t==="lavage"?"LAVAGE":t==="corrosion"?"INSP. ANTI-CORR.":"LAV. COMPR.";
const tH=t=>t==="pointFixe"?"pf-h":t==="lavage"?"lav-h":t==="corrosion"?"tc-h":"lc-h";
const tP=t=>t==="pointFixe"?"pending-pf":t==="lavage"?"pending-lav":t==="corrosion"?"pending-tc":"pending-lc";
const tC=t=>t==="pointFixe"?{c:"var(--pf)",bg:"var(--pf-bg)",bd:"var(--pf-bd)"}:t==="lavage"?{c:"var(--lav)",bg:"var(--lav-bg)",bd:"var(--lav-bd)"}:t==="corrosion"?{c:"var(--tc)",bg:"var(--tc-bg)",bd:"var(--tc-bd)"}:{c:"var(--lc)",bg:"var(--lc-bg)",bd:"var(--lc-bd)"};

function getSt(){if(!pubSched)return{pf:0,lv:0,co:0,lc:0,dn:0,ms:0,total:0,act:0,sz:fleet.length,pend:0};
  let pf=0,lv=0,co=0,lcc=0,dn=0,ms=0,total=0;
  Object.entries(pubSched).forEach(([dt,s])=>{if(!s||dt.startsWith("_"))return;
    TASK_TYPES.forEach(ty=>{if(!s[ty])return;s[ty].forEach(im=>{total++;const r=taskStatus(im,ty,dt);if(r.st==="done")dn++;else if(r.st==="missed")ms++;});});
    pf+=(s.pointFixe||[]).length;lv+=(s.lavage||[]).length;co+=(s.corrosion||[]).length;lcc+=(s.lavComp||[]).length;
  });
  return{pf,lv,co,lc:lcc,dn,ms,total,act:fleet.filter(a=>a.active&&a.lastFlight).length,sz:fleet.length,pend:Object.keys(pendingSubs).length};}

    {l:"Actifs",v:s.act,c:"var(--pf)"},{l:"Lavages",v:s.lv,c:"var(--lav)"},{l:"Insp. Anti-Corr.",v:s.co,c:"var(--tc)"},{l:"Lav.Comp.",v:s.lc,c:"var(--lc)"},{l:"Réalisés",v:s.dn+"/"+s.total,c:"var(--ok)"},{l:"Manqués",v:s.ms,c:s.ms?"var(--dn)":"var(--ok)"}
  ].map(x=>`<div class="stat"><div class="stat-label">${x.l}</div><div class="stat-value" style="color:${x.c}">${x.v}</div></div>`).join("");
  document.getElementById("rb").textContent=s.ms;document.getElementById("rb").style.display=s.ms?"inline":"none";

  document.getElementById("pS").textContent=`DU 01/${String(cM+1).padStart(2,'0')}/${cY} AU ${dim(cM,cY)}/${String(cM+1).padStart(2,'0')}/${cY} · ${s.act} aéronefs · ${fmtL(today)}`;
  let sh="";if(sigName||sigPost||sigImage){sh+=`<div style="text-align:right;margin-top:12px">`;if(sigImage)sh+=`<img src="${sigImage}" style="max-height:60px;display:block;margin-left:auto;margin-bottom:3px">`;if(sigName)sh+=`<div style="font-size:10px;font-weight:800">${sigName}</div>`;if(sigPost)sh+=`<div style="font-size:8px;color:#64748b">${sigPost}</div>`;sh+=`</div>`;}
  document.getElementById("sigA").innerHTML=sh;}

function rSch(){
  if(!pubSched){document.getElementById("vSch").innerHTML=`<div style="text-align:center;padding:30px;color:var(--text2)">Chargement...</div>`;return;}
  const nd=dim(cM,cY),sd=new Date(cY,cM,1),le=new Date(cY,cM,nd);
  let mon=new Date(sd);while(mon.getDay()!==1)mon.setDate(mon.getDate()-1);
  let fri=new Date(le);while(fri.getDay()!==5)fri.setDate(fri.getDate()+1);
  const wks=[];let cur=new Date(mon);while(cur<=fri){const w=[];for(let i=0;i<5;i++){w.push({d:dk(cur),in:cur.getMonth()===cM&&cur.getFullYear()===cY});cur.setDate(cur.getDate()+1);}cur.setDate(cur.getDate()+2);wks.push(w);}

  let h=`<div class="month-nav no-print"><button onclick="pM()">◀</button><div class="month-label">${MO[cM]} ${cY}</div><button onclick="nM()">▶</button>
    ${isSuper?`<button onclick="if(confirm('Recalculer le planning à partir d\\'aujourd\\'hui ?'))publishSchedule()" class="no-print" style="margin-left:auto;width:38px;height:38px;border-radius:10px;border:none;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;cursor:pointer;font-size:20px;font-weight:700;box-shadow:0 4px 12px rgba(59,130,246,.3);display:flex;align-items:center;justify-content:center" title="Regénérer le planning">↻</button>`:''}</div>`;
  h+=`<div class="legend-bar no-print"><div class="legend-item"><div class="ld ld-p"></div>À faire</div><div class="legend-item"><div class="ld ld-d"></div>✓Fait</div><div class="legend-item"><div class="ld ld-m"></div>✗Manqué</div><div class="legend-item"><div class="ld ld-s"></div>Inutile</div></div>`;
  const pc=Object.keys(pendingSubs).length;
  if(pc&&isSuper)h+=`<div onclick="sv('validation')" style="background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:8px;padding:8px 14px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;font-weight:800;font-size:12px;color:var(--warn)" class="no-print"><span>📋 ${pc} saisie(s) en attente</span><span>→</span></div>`;

  let weekIdx=0;const weeksInfo=[];
  // Filter weeks with content
  wks.forEach(w=>{
    const inW=w.filter(x=>x.in);
    // Check if week has any tasks
    let weekHasTasks=false;
    w.forEach(({d,in:inM})=>{if(!inM)return;const sl=pubSched[d];if(!sl)return;if(TASK_TYPES.some(ty=>sl[ty]&&sl[ty].length))weekHasTasks=true;});
    // Skip weeks entirely in past with no tasks
    const allPast=inW.every(x=>x.d<today);
    if(allPast&&!weekHasTasks)return;

    const ws=inW.length?inW[0].d:w[0].d,we=inW.length?inW[inW.length-1].d:w[4].d;
    let wDone=0,wTotal=0;
    w.forEach(({d,in:inM})=>{if(!inM)return;const sl=pubSched[d];if(!sl)return;TASK_TYPES.forEach(ty=>{if(!sl[ty])return;sl[ty].forEach(im=>{const r=taskStatus(im,ty,d);if(r.st!=="skip"){wTotal++;if(r.st==="done")wDone++;}});});});
    const wPct=wTotal?Math.round(wDone/wTotal*100):0;const bc=wPct>=80?"var(--ok)":wPct>=40?"var(--tc)":"var(--dn)";
    weeksInfo.push({idx:weekIdx,label:`Sem. ${fmt(ws)} — ${fmt(we)}`,ws,we});
    h+=`<div class="wblock" data-week="${weekIdx}"><div class="wheader"><span class="wheader-label">Sem. ${fmt(ws)} — ${fmt(we)}</span><div class="wprog">${wDone}/${wTotal}<div class="wprog-bar"><div class="wprog-fill" style="width:${wPct}%;background:${bc}"></div></div>${wPct}%</div></div><div class="wgrid">`;
    // ... day columns rendered below
    w.forEach(({d,in:inM})=>{
      const dt=new Date(d+'T12:00:00'),isT=d===today,isP=d<today;
      if(!inM){h+=`<div class="dcol outside"><div class="dhead">${WD[dt.getDay()]} ${dt.getDate()}</div></div>`;return;}
      const sl=pubSched[d]||{pointFixe:[],lavage:[],corrosion:[],lavComp:[]};
      const hasTasks=TASK_TYPES.some(ty=>sl[ty]&&sl[ty].length);
      // Skip past empty days
      if(isP&&!isT&&!hasTasks){h+=`<div class="dcol" style="opacity:.2"><div class="dhead">${WD[dt.getDay()]} ${dt.getDate()}</div><div style="text-align:center;margin-top:12px;font-size:7px;color:var(--text3);font-weight:700">PASSÉ</div></div>`;return;}

      h+=`<div class="dcol${isT?' today':''}"><div class="dhead">${WD[dt.getDay()]} ${dt.getDate()}</div>`;
      TASK_TYPES.forEach(ty=>{
        if(!sl[ty]||!sl[ty].length)return;
        h+=`<div class="tsec"><div class="tsec-head ${tH(ty)}">${tl(ty)}</div>`;
        sl[ty].forEach(im=>{const r=taskStatus(im,ty,d);let cls,ico,bdg="";
          if(r.st==="done"){cls="done";ico="✓";bdg=r.doneDate?`<span class="tp-badge" style="background:var(--ok);color:#fff">FAIT ${fmt(r.doneDate)}</span>`:`<span class="tp-badge" style="background:var(--ok);color:#fff">FAIT</span>`;}
          else if(r.st==="missed"){cls="missed";ico="✗";bdg=`<span class="tp-badge" style="background:var(--dn);color:#fff">MANQUÉ</span>`;}
          else if(r.st==="skip"){cls="skip";ico="—";bdg=`<span class="tp-badge" style="background:var(--skip);color:#fff">${r.label}</span>`;}
          else{cls=`pending ${tP(ty)}`;ico="○";}
          h+=`<div class="tp ${cls}"><div class="tp-ico">${ico}</div><span class="tp-name">${im}</span>${bdg}</div>`;
        });h+=`</div>`;
      });
      if(!hasTasks)h+=`<div style="font-size:8px;color:var(--text3);margin-top:12px;text-align:center">—</div>`;
      h+=`</div>`;
    });h+=`</div></div>`;weekIdx++;
  });
  document.getElementById("vSch").innerHTML=h;
  // Populate print scope dropdown
  const sel=document.getElementById("printScope");if(sel){sel.innerHTML=`<option value="all">Mois complet</option>`;weeksInfo.forEach(w=>{sel.innerHTML+=`<option value="${w.idx}">${w.label}</option>`;});}
}

// Get weeks (Mon-Fri) for current month
function getWeeksList(){
  if(!pubSched)return[];
  const nd=dim(cM,cY),sd=new Date(cY,cM,1),le=new Date(cY,cM,nd);
  let mon=new Date(sd);while(mon.getDay()!==1)mon.setDate(mon.getDate()-1);
  let fri=new Date(le);while(fri.getDay()!==5)fri.setDate(fri.getDate()+1);
  const wks=[];let cur=new Date(mon);
  while(cur<=fri){
    const days=[];for(let i=0;i<5;i++){days.push(dk(new Date(cur)));cur.setDate(cur.getDate()+1);}cur.setDate(cur.getDate()+2);
    // Only keep weeks that have at least one day in the current month
    const inMonth=days.filter(d=>{const x=new Date(d+'T12:00:00');return x.getMonth()===cM&&x.getFullYear()===cY;});
    if(inMonth.length){
      const start=inMonth[0],end=inMonth[inMonth.length-1];
      wks.push({start,end,days:inMonth});
    }
  }
  return wks;
}

// Export tasks as JSON for external app
function exportTasksJSON(){
  if(!pubSched){alert("Aucun planning à exporter");return;}
  const scope=document.getElementById("expWeek").value;
  let filterDays=null;
  if(scope!=="all"){const[start,end]=scope.split("|");filterDays=d=>d>=start&&d<=end;}

  const tasks=[];
  Object.entries(pubSched).forEach(([dt,s])=>{
    if(!s||dt.startsWith("_"))return;
    if(filterDays&&!filterDays(dt))return;
    ["pointFixe","lavage","corrosion","lavComp"].forEach(ty=>{
      if(!s[ty])return;
      s[ty].forEach(im=>{
        const ac=fleet.find(a=>a.immat===im);
        const status=taskStatus(im,ty,dt);
        tasks.push({
          date:dt,
          taskType:ty,
          taskLabel:TLABEL[ty],
          aircraft:im,
          aircraftType:ac?.type||null,
          hasLavComp:ac?.hasLavComp||false,
          status:status.st,
          statusDetails:status.label||status.doneDate||null,
          lastFlight:ac?.lastFlight||null,
          lastDate:ac?(ty==="pointFixe"?ac.lastPointFixe:ty==="lavage"?ac.lastLavage:ty==="corrosion"?ac.lastCorrosion:ac.lastLavComp):null
        });
      });
    });
  });
  tasks.sort((a,b)=>a.date.localeCompare(b.date)||a.aircraft.localeCompare(b.aircraft));

  const scopeLabel=scope==="all"?`${MO[cM]}_${cY}`:`Sem_${scope.split("|")[0]}`;
  const payload={
    meta:{
      source:"PISTE",
      app:"Planning Lavage · Point Fixe · Insp. Anti-Corrosion",
      exportedAt:new Date().toISOString(),
      exportedBy:curAdmin?(curAdmin.name||curAdmin.id):"admin",
      month:MO[cM]+" "+cY,
      scope:scope==="all"?"month":"week",
      scopeRange:scope==="all"?{start:dk(new Date(cY,cM,1)),end:dk(new Date(cY,cM,dim(cM,cY)))}:{start:scope.split("|")[0],end:scope.split("|")[1]},
      taskCount:tasks.length
    },
    taskTypes:{pointFixe:{label:"Point Fixe",interval:7,maxPerDay:maxDay.pointFixe},lavage:{label:"Lavage",interval:9,maxPerDay:maxDay.lavage},corrosion:{label:"Inspection Anti-Corrosion",interval:9,maxPerDay:maxDay.corrosion},lavComp:{label:"Lavage Compresseur",interval:7,maxPerDay:maxDay.lavComp}},
    tasks
  };

  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`piste_tasks_${scopeLabel}.json`;a.click();
  addLog(`Export JSON: ${tasks.length} tâches (${scope==="all"?"mois complet":"semaine"})`);
}

    {id:"sect-admins",label:"Comptes admin",icon:'<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-3-3.87"/><path d="M7 21v-2a4 4 0 014-4h2"/><circle cx="9" cy="7" r="4"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>'},
    {id:"sect-mobile",label:"Utilisateurs mobile",icon:'<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>'},
    {id:"sect-signature",label:"Signature",icon:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><polyline points="14 7 21 7 21 14"/></svg>'},
    {id:"sect-maxday",label:"Tâches/jour",icon:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'},
    {id:"sect-print",label:"Impression",icon:'<svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>'},
    {id:"sect-export",label:"Export JSON",icon:'<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'},
    {id:"sect-backup",label:"Sauvegarde",icon:'<svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>'}
  ];
  const inner=vAdm.innerHTML;
  const navHtml=sections.map((s,i)=>`<button class="settings-nav-item${i===0?' active':''}" data-target="${s.id}" onclick="switchSettings('${s.id}',this)">${s.icon}<span>${s.label}</span></button>`).join("");
  vAdm.innerHTML=`<div class="settings-layout">
    <aside class="settings-nav" aria-label="Sections des paramètres">${navHtml}</aside>
    <div class="settings-panel" id="settingsPanel">
      ${inner}
    </div>
  </div>`;
}
function switchSettings(target,el){
  document.querySelectorAll(".settings-nav-item").forEach(b=>b.classList.remove("active"));
  if(el)el.classList.add("active");
  document.querySelectorAll(".settings-section").forEach(s=>s.classList.remove("active"));
  const tgt=document.getElementById(target);
  if(tgt)tgt.classList.add("active");
  const panel=document.getElementById("settingsPanel");
  if(panel)panel.scrollTop=0;
}
// Alias for backward compat
function scrollSettings(target,el){switchSettings(target,el);}
// Wrap rSt to keep topbar subtitle fresh on data updates
const __rSt_original=rSt;
rSt=function(){__rSt_original();try{updateTopbar(cv);}catch(e){}};

initFB();applyPrintFonts();updateTopbar(cv);
</script>
